<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
  <title id="title">Field preparation sequence</title>
  <desc id="desc">Four steps: test and clear, loosen and level, incorporate amendments, and prepare a crop-appropriate seedbed.</desc>
  <rect width="1000" height="360" rx="18" fill="#f7f5e9"/>
  <text x="500" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#24452e">FIELD PREPARATION — PLAN FOR SOIL, WATER AND CROP</text>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <g transform="translate(40 80)">
      <rect width="215" height="220" rx="15" fill="#fff" stroke="#94aa7a" stroke-width="2"/>
      <circle cx="107" cy="58" r="34" fill="#e7efd9"/>
      <path d="M92 54h30M107 39v30M96 69l-10 12m32-12 10 12" stroke="#47683d" stroke-width="4" fill="none" stroke-linecap="round"/>
      <text x="107" y="120" font-size="18" font-weight="700" fill="#24452e">1. TEST &amp; CLEAR</text>
      <text x="107" y="151" font-size="14" fill="#39433a"><tspan x="107">Soil test; remove residues</tspan><tspan x="107" dy="21">and perennial weeds.</tspan><tspan x="107" dy="21">Plan drainage and irrigation.</tspan></text>
    </g>
    <g transform="translate(285 80)">
      <rect width="215" height="220" rx="15" fill="#fff" stroke="#94aa7a" stroke-width="2"/>
      <circle cx="107" cy="58" r="34" fill="#e7efd9"/>
      <path d="M77 67c18-18 42-18 60 0M77 77c18-18 42-18 60 0M91 46l-10 31m28-38v38m28-31 10 31" stroke="#47683d" stroke-width="3" fill="none" stroke-linecap="round"/>
      <text x="107" y="120" font-size="18" font-weight="700" fill="#24452e">2. LOOSEN &amp; LEVEL</text>
      <text x="107" y="151" font-size="14" fill="#39433a"><tspan x="107">Till only as needed at</tspan><tspan x="107" dy="21">suitable moisture; avoid</tspan><tspan x="107" dy="21">compaction and clods.</tspan></text>
    </g>
    <g transform="translate(530 80)">
      <rect width="215" height="220" rx="15" fill="#fff" stroke="#94aa7a" stroke-width="2"/>
      <circle cx="107" cy="58" r="34" fill="#e7efd9"/>
      <path d="M78 70h58M84 60h46M91 50h32M99 40h16" stroke="#47683d" stroke-width="5" stroke-linecap="round"/>
      <text x="107" y="120" font-size="18" font-weight="700" fill="#24452e">3. AMEND &amp; DRAIN</text>
      <text x="107" y="151" font-size="14" fill="#39433a"><tspan x="107">Apply tested lime/gypsum</tspan><tspan x="107" dy="21">and well-rotted manure</tspan><tspan x="107" dy="21">as locally recommended.</tspan></text>
    </g>
    <g transform="translate(775 80)">
      <rect width="185" height="220" rx="15" fill="#fff" stroke="#94aa7a" stroke-width="2"/>
      <circle cx="92" cy="58" r="34" fill="#e7efd9"/>
      <path d="M92 77V43m0 18c-18 0-23-8-24-18 13 0 21 5 24 18m0-7c3-13 11-18 24-18-1 10-6 18-24 18" stroke="#47683d" stroke-width="3" fill="none" stroke-linecap="round"/>
      <text x="92" y="120" font-size="18" font-weight="700" fill="#24452e">4. MAKE SEEDBED</text>
      <text x="92" y="151" font-size="14" fill="#39433a"><tspan x="92">Fine for small seed;</tspan><tspan x="92" dy="21">firm, moist and level.</tspan><tspan x="92" dy="21">Use beds/ridges as suited.</tspan></text>
    </g>
  </g>
  <text x="500" y="333" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#596254">Do not over-till wet soil. Match the seedbed to crop, rainfall, soil texture and drainage.</text>
</svg>
